<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ella's Word Den</title>
<meta name="theme-color" content="#FFF0FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --bg:#FFF0FA; --surface:#FFFFFF; --ink:#3A2456; --muted:#7D6596; --line:#F1D7EE;
  --sv:#1E6FD9; --en:#1F9D5A; --zh:#E03A3A; --gold:#FFB800; --accent:#B04FE0;
  --rainbow:linear-gradient(90deg,#FF7EB6,#FFB86B,#FFE066,#7DE3B0,#7CC8FF,#B99CFF,#F59BFF);
  --p1:#FFE3F1; --p2:#EEE4FF; --p3:#E2F7EE; --p4:#E3F1FF; --p5:#FFEBDD; --p6:#FFF6CC;
  --svBg:#E6F0FF; --enBg:#E3F6EB; --zhBg:#FFE8E6;
  --display:"Fredoka","Trebuchet MS","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --body:"Nunito","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --hanzi:"Kaiti SC","STKaiti","KaiTi","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
html{min-height:100%;background:linear-gradient(180deg,#FFF0FA 0%,#F4ECFF 55%,#EAF6FF 100%) fixed}
body{background:transparent}
body{color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Top bar */
.top{display:flex;align-items:center;gap:10px;min-height:56px;position:relative;padding-bottom:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;border-radius:999px;background:var(--rainbow)}
.top h1{font-size:1.6rem;flex:1;display:flex;gap:.35em;flex-wrap:wrap;align-items:baseline}
.top h1{background:linear-gradient(90deg,#E0489A,#B04FE0,#5B7CFA);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.top h1 .sp{color:initial;-webkit-text-fill-color:initial;font-size:.8em}
.iconbtn{width:52px;height:52px;border-radius:18px;background:var(--surface);border:2px solid var(--line);font-size:1.6rem;display:grid;place-items:center;flex:none}
.starpill{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:1.25rem}

/* Buddy */
.buddy{display:flex;align-items:center;gap:12px}
.buddy .pal{font-size:3.4rem;line-height:1;flex:none;transition:transform .2s}
.buddy .pal.hop{animation:hop .6s}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px 16px;font-family:var(--display);font-weight:600;font-size:1.2rem;position:relative}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-18px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}

/* Home tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:var(--surface);border:3px solid var(--line);border-radius:26px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tiles>.tile:nth-child(6n+1){background:var(--p1)}.tiles>.tile:nth-child(6n+2){background:var(--p2)}.tiles>.tile:nth-child(6n+3){background:var(--p3)}
.tiles>.tile:nth-child(6n+4){background:var(--p4)}.tiles>.tile:nth-child(6n+5){background:var(--p5)}.tiles>.tile:nth-child(6n+6){background:var(--p6)}
.tile{border-color:#fff;box-shadow:0 4px 0 rgba(176,79,224,.12)}
.group{display:flex;flex-direction:column;gap:10px}
.group h2{font-size:1.35rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group h2 small{font-family:var(--body);font-size:.85rem;font-weight:800;color:var(--muted)}
.tile .ic{font-size:3rem;line-height:1.1}
.tile b{font-family:var(--display);font-size:1.25rem;font-weight:600}
.tile small{color:var(--muted);font-size:.85rem;font-weight:800}
.tile.sm .ic{font-size:2.4rem}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent) inset}

/* Language chips */
.chip{display:inline-grid;place-items:center;min-width:40px;height:30px;padding:0 8px;border-radius:999px;color:#fff;font-family:var(--display);font-weight:700;font-size:.95rem;flex:none}
.chip.sv{background:var(--sv)} .chip.en{background:var(--en)} .chip.zh{background:var(--zh)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-family:var(--display);font-weight:600;font-size:1.05rem}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill.sv[aria-pressed="true"]{background:var(--sv);border-color:var(--sv)}
.pill.en[aria-pressed="true"]{background:var(--en);border-color:var(--en)}
.pill.zh[aria-pressed="true"]{background:var(--zh);border-color:var(--zh)}
.label{font-weight:800;color:var(--muted);font-size:.95rem;margin-bottom:6px}

/* Pictures */
.pic{display:grid;place-items:center;line-height:1}
.emo{font-size:var(--ps,7rem)}
.swatch{width:var(--sw,140px);height:var(--sw,140px);border-radius:50%;border:4px solid rgba(0,0,0,.12)}
.num{display:flex;flex-direction:column;align-items:center;gap:6px}
.num b{font-family:var(--display);font-size:calc(var(--ps,7rem)*.8);line-height:1}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:150px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--gold)}
.han{display:flex;flex-direction:column;align-items:center;gap:4px}
.han b{font-family:var(--hanzi);font-size:calc(var(--ps,7rem)*1.05);font-weight:400;color:var(--zh);line-height:1}
.han span{font-size:calc(var(--ps,7rem)*.35)}

/* Word card */
.card{background:var(--surface);border:3px solid var(--line);border-radius:32px;padding:20px;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.card .bigpic{min-height:190px;border-radius:24px;background:var(--bg)}
.wrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;text-align:left;width:100%;transition:transform .12s}
.wrow:active{transform:scale(.98)}
.wrow.sv{background:var(--svBg)} .wrow.en{background:var(--enBg)} .wrow.zh{background:var(--zhBg)}
.wrow .w{font-family:var(--display);font-size:1.9rem;font-weight:600;flex:1}
.wrow .w small{display:block;font-family:var(--body);font-size:1rem;color:var(--muted);font-weight:800}
.wrow.zh .w{font-size:2.2rem}
.wrow .spk{font-size:1.4rem;opacity:.7}
.wrow.on{box-shadow:0 0 0 3px currentColor inset}
.wrow.sv.on{color:var(--sv)} .wrow.en.on{color:var(--en)} .wrow.zh.on{color:var(--zh)}
.wrow.on .w{color:var(--ink)}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bigbtn{background:var(--accent);color:#fff;border-radius:22px;padding:14px 22px;font-family:var(--display);font-weight:600;font-size:1.3rem;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.bigbtn.ghost{background:var(--surface);color:var(--ink);border:3px solid var(--line)}
.bigbtn.go{background:var(--en)}
.bigbtn:disabled{opacity:.4}
.dotsnav{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dotsnav i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dotsnav i.on{background:var(--accent)}

/* Games */
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.prompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.hear{width:110px;height:110px;border-radius:50%;font-size:3.2rem;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.hear:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hear.zh{background:var(--zh)} .hear.sv{background:var(--sv)} .hear.en{background:var(--en)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:560px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--surface);border:3px solid var(--line);border-radius:26px;min-height:150px;padding:10px;display:grid;place-items:center;--ps:4.6rem;--sw:90px;transition:transform .12s}
.opt:active{transform:scale(.96)}
.opt.word{min-height:90px;font-family:var(--display);font-size:2.2rem;font-weight:600}
.opt.right{border-color:var(--en);background:var(--enBg);animation:pop .4s}
.opt.wrong{animation:wiggle .4s;opacity:.35}
.opt.hint{animation:pulse 1s infinite}
@keyframes wiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--gold)}}
.reveal{display:flex;flex-direction:column;gap:8px;width:100%;max-width:560px}
.progressbar{width:100%;max-width:560px;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.progressbar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF8A00);border-radius:999px;transition:width .3s}
.tilesrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ltile{min-width:78px;height:96px;padding:0 12px;border-radius:20px;background:var(--surface);border:3px solid var(--line);font-family:var(--display);font-size:3rem;font-weight:600;display:grid;place-items:center;transition:transform .15s,background .15s}
.ltile.on{background:#FFF1C2;border-color:var(--gold);transform:translateY(-6px)}
.ltile.done{border-color:var(--gold)}
.tilesrow.merged{gap:0}
.tilesrow.merged .ltile{border-radius:0;border-left-width:0;border-right-width:0;background:#FFF1C2;border-color:var(--gold)}
.tilesrow.merged .ltile:first-child{border-radius:20px 0 0 20px;border-left-width:3px}
.tilesrow.merged .ltile:last-child{border-radius:0 20px 20px 0;border-right-width:3px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.lcard{background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lcard b{font-family:var(--display);font-size:3.2rem;line-height:1.1}
.lcard span{font-size:2rem}
.lcard small{font-weight:800;color:var(--muted)}
.lcard.on{border-color:var(--gold);background:#FFF8DD}
.mic{width:130px;height:130px;border-radius:50%;background:var(--zh);color:#fff;font-size:3.6rem;display:grid;place-items:center;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.mic.rec{animation:pulse 1s infinite;background:#C81E1E}
.mic.wait{background:var(--muted)}
.count{font-family:var(--display);font-size:1.4rem;font-weight:600;min-height:1.6em}
.finish{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px 0}
.finish .big{font-size:5rem;line-height:1}
.finish h2{font-size:2rem}
.starsrow{font-size:2.4rem;letter-spacing:4px}

/* Stickers */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px}
.stk{aspect-ratio:1;border-radius:22px;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-size:2.8rem}
.stk.locked{font-size:1.6rem;color:var(--muted);background:#F6EEFF;border-style:dashed;font-family:var(--display)}
.stk.new{animation:pop .6s 3;border-color:var(--gold)}

/* Grown-ups */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:1.35rem}
.panel p{margin:0;color:var(--muted);font-size:.95rem}
.stat{display:flex;align-items:center;gap:10px;font-weight:800}
.stat .bar{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.stat .bar span{display:block;height:100%}
.wordlist{display:flex;flex-wrap:wrap;gap:6px}
.wordlist span{padding:4px 10px;border-radius:999px;background:var(--zhBg);font-weight:800;font-size:.95rem}
.wordlist span.k{background:var(--enBg)}
.recrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.recrow .p{width:52px;--ps:2.2rem;--sw:36px;flex:none}
.recrow .nm{flex:1;min-width:110px;font-weight:800;font-size:.95rem}
.recbtn{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:.9rem;background:var(--surface)}
.recbtn.has{background:var(--enBg);border-color:var(--en)}
.recbtn.live{background:#C81E1E;color:#fff;border-color:#C81E1E}
select{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0;background:rgba(123,92,255,.25);transform:scaleX(0);transform-origin:left}
.hold.holding .fill{transform:scaleX(1);transition:transform 1.5s linear}
.note{font-size:.9rem;color:var(--muted);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
/* Streak box */
.streak{background:var(--surface);border:3px solid #fff;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 rgba(176,79,224,.12)}
.streak .nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sb{border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center}
.sb.a{background:var(--p2)} .sb.b{background:var(--p1)}
.sb b{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.1}
.sb small{font-weight:800;color:var(--muted);font-size:.85rem}
.todaybar{height:22px;border-radius:999px;background:var(--p2);overflow:hidden;position:relative}
.todaybar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF7EB6,#B99CFF);transition:width .4s}
.todaytxt{font-family:var(--display);font-weight:600;font-size:1.1rem;text-align:center}
.week{display:flex;justify-content:space-between;gap:4px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.8rem;color:var(--muted)}
.week i{font-style:normal;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#F6EEFF;font-size:1.1rem}
.week .today i{box-shadow:0 0 0 3px var(--accent)}
.bigbtn.daily{background:linear-gradient(90deg,#E0489A,#B04FE0);font-size:1.4rem;padding:16px 22px}
.toast{position:fixed;left:0;right:0;margin:0 auto;top:18%;z-index:10;background:#fff;border:4px solid #FF7EB6;border-radius:30px;padding:20px 26px;text-align:center;
  box-shadow:0 12px 40px rgba(176,79,224,.35);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(90vw,380px);animation:pop .5s}
.toast .h{font-size:4.6rem;line-height:1;animation:hop .8s 2}
.toast b{font-family:var(--display);font-size:1.5rem;color:#E0489A}
.toast small{font-weight:800;color:var(--muted)}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:1.8rem;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:480px){
  .top h1{font-size:1.3rem}
  .wrow .w{font-size:1.6rem}.wrow.zh .w{font-size:1.9rem}
  .opt{min-height:120px;--ps:3.8rem}
  .opts.c3{grid-template-columns:repeat(3,1fr);gap:8px}
  .ltile{min-width:62px;height:80px;font-size:2.4rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

let ac=null,unlocked=false;
function audioCtx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}if(ac.state!=="running")try{ac.resume()}catch(e){}return ac}
function unlock(){if(unlocked)return;unlocked=true;const a=audioCtx();if(!a)return;try{const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}
["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
function tones(list,type){const a=audioCtx();if(!a)return;const go=()=>{const t=a.currentTime+.02;list.forEach(([f,dt],i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const s=t+dt;
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.3);o.connect(g).connect(a.destination);o.start(s);o.stop(s+.35)})};
  a.state==="running"?go():a.resume().then(go).catch(()=>{})}

const PREF={sv:["sv"],en:["en-gb","en-sg","en-au","en-ie","en-us","en"],zh:["zh-cn","zh-sg","cmn","zh-tw","zh"]};
function pickVoice(lang){
  const vs=voices.map(v=>[v,(v.lang||"").replace("_","-").toLowerCase()]).filter(([v,l])=>!(lang==="zh"&&(l.includes("hk")||l.includes("yue"))));
  for(const p of PREF[lang]){const m=vs.filter(([v,l])=>l.startsWith(p));if(m.length)return (m.find(([v])=>/natural|enhanced|premium|neural|google/i.test(v.name))||m[0])[0]}
  return null}
let seqId=0,playing=null;

const wait=ms=>new Promise(r=>setTimeout(r,ms));
/* Plays a grown-up's recording if there is one, otherwise the device voice. */
function say(lang,text,key,rate){return new Promise(res=>{
  let done=false;const fin=()=>{if(!done){done=true;res()}};
  if(key&&recs.has(key)){try{const a=new Audio(recs.get(key));playing=a;a.onended=fin;a.onerror=fin;a.play().catch(fin);setTimeout(fin,8000)}catch(e){fin()}return}
  if(!canSpeak){setTimeout(fin,400);return}
  try{const u=new SpeechSynthesisUtterance(text);u.lang=VOICE[lang];const v=pickVoice(lang);if(v)u.voice=v;
    u.rate=rate||(lang==="zh"?.75:.85);u.pitch=1.05;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);setTimeout(fin,1800+text.length*(lang==="zh"?450:120))}catch(e){fin()}
})}

const recs=new Map();let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("ordwords",1);r.onupgradeneeded=()=>r.result.createObjectStore("rec");r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
async function loadRecs(){await openDB();if(!db)return;try{const req=db.transaction("rec").objectStore("rec").openCursor();
  req.onsuccess=()=>{const c=req.result;if(c){recs.set(c.key,URL.createObjectURL(c.value));c.continue()}}}catch(e){}}
function saveRec(key,blob){if(recs.has(key))URL.revokeObjectURL(recs.get(key));recs.set(key,URL.createObjectURL(blob));try{db&&db.transaction("rec","readwrite").objectStore("rec").put(blob,key)}catch(e){}}
function delRec(key){if(recs.has(key))URL.revokeObjectURL(recs.get(key));recs.delete(key);try{db&&db.transaction("rec","readwrite").objectStore("rec").delete(key)}catch(e){}}
const canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
async function startRec(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(stream);const chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());r(new Blob(chunks,{type:mr.mimeType||"audio/webm"}))});
  mr.start();return {stop(){if(mr.state!=="inactive")mr.stop();return done}}}

function picHTML(w,ps){

  if(w.deck&&w.deck.chars)return `<div class="pic han"${st}><b lang="zh">${w.zh}</b><span>${w.pic}</span></div>`;
  const p=w.pic||w;
  if(p[0]==="#")return `<div class="pic"${st}><div class="swatch" style="background:${p}"></div></div>`;
  if(p.startsWith("n:")){const n=+p.slice(2);return `<div class="pic num"${st}><b>${n}</b><div class="dots">${"<i></i>".repeat(n)}</div></div>`}
  return `<div class="pic"${st}><span class="emo">${p}</span></div>`}
const chip=l=>`<span class="chip ${l}">${LANG[l].chip}</span>`;
function wordRow(w,l){
  const py=l==="zh"&&settings.pinyin?`<small>${esc(w.py)}</small>`:"";
  return `<button class="wrow ${l}" data-l="${l}" lang="${l}">${chip(l)}<span class="w">${esc(w[l])}${py}</span><span class="spk">🔊</span></button>`}
function deckName(d){return `<b>${esc(d.name.en)}</b><small><span style="color:var(--sv)">${esc(d.name.sv)}</span> · <span style="color:var(--zh)">${esc(d.name.zh)}</span></small>`}
function confetti(){const c=$("#confetti");const e=["⭐","🌟","✨","🎉","💛"];for(let i=0;i<24;i++){const s=document.createElement("i");s.textContent=rnd(e);s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.5+"s";c.appendChild(s);setTimeout(()=>s.remove(),2400)}}
function buddy(msg){return `<div class="buddy"><button class="pal" id="pal" aria-label="Unicorn friend">🦄</button><div class="bubble" id="bubble">${msg}</div></div>`}
function hop(msg){const p=$("#pal");if(p){p.classList.remove("hop");void p.offsetWidth;p.classList.add("hop")}if(msg&&$("#bubble"))$("#bubble").innerHTML=msg}
function praise(lang){const t=rnd(LANG[lang].praise);hop(esc(t));return {lang,text:t}}
function pickLang(){const g=settings.gameLang;if(g!=="mix")return g;const r=Math.random();return r<.5?"zh":r<.75?"sv":"en"}

function streakBox(){
  const t=today(),per=settings.perHeart,cap=settings.heartCap,n=streakDays();
  const done=t.hearts>=cap;const into=done?per:t.words-t.hearts*per;
  const msg=done?"Today's hearts are done! 🎉 Bra jobbat!":`${per-into} more words for a 💖`;
  const days=[6,5,4,3,2,1,0].map(i=>{const d=dayAgo(i),x=daily[dayKey(d)];
    return `<div class="${i===0?"today":""}"><i>${x&&x.hearts?"💖":""}</i>${"SMTWTFS"[d.getDay()]}</div>`}).join("");
  return `<section class="streak" aria-label="Streak">
    <div class="nums"><div class="sb a"><b>🌈 ${n}</b><small>${n===1?"day":"days"} in a row</small></div>
      <div class="sb b"><b>💖 ${t.hearts}</b><small>${t.hearts===1?"heart":"hearts"} today</small></div></div>
    <div class="todaybar"><span style="width:${into/per*100}%"></span></div>
    <div class="todaytxt">${msg}</div>
    <div class="week">${days}</div>
    ${done?"":`<button class="bigbtn daily" id="daily">⭐ Daily ${per} words</button>`}
  </section>`}
function holdToOpen(el,fn){let t=null;
  const start=e=>{e.preventDefault();el.classList.add("holding");t=setTimeout(()=>{el.classList.remove("holding");fn()},1500)};
  const end=()=>{el.classList.remove("holding");clearTimeout(t)};
  el.addEventListener("pointerdown",start);["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,end));
  el.addEventListener("contextmenu",e=>e.preventDefault())}

/* ---------- Listen & find ---------- */
const ROUNDS=8;
function pickTargets(pool,lang,n){
  /* Words she knows less well come up more often. */
  const bag=[];pool.forEach(w=>{const p=progress[lang][w.id];const ok=p?p.ok:0;const wt=Math.max(1,4-ok);for(let k=0;k<wt;k++)bag.push(w)});
  const out=[];const sh=shuffle(bag);for(const w of sh){if(!out.includes(w))out.push(w);if(out.length>=n)break}
  while(out.length<n)out.push(rnd(pool));return out}
function makeOptions(target,pool,lang,n){
  const others=shuffle(pool.filter(w=>w!==target&&w.pic!==target.pic&&w[lang]!==target[lang]));
  return shuffle([target,...others.slice(0,n-1)])}
VIEWS.find=app=>{
  if(!view.deck)return deckPicker(app,"Listen, then tap the picture!",id=>startFind(id),{all:true,langs:true});
  const g=view.game;
  if(g.r>=g.max)return endScreen(app,g,g.daily?()=>go("home"):()=>startFind(view.deck));
  const r=g.rounds[g.r];
  app.innerHTML=`<div class="stage">
    <div class="progressbar"><span style="width:${g.r/g.max*100}%"></span></div>
    ${buddy(r.lang==="zh"?"听一听！Where is it?":r.lang==="sv"?"Lyssna! Var är den?":"Listen! Where is it?")}
    <div class="prompt"><button class="hear ${r.lang}" id="hear" aria-label="Hear again">🔊</button>${chip(r.lang)}</div>
    <div class="opts ${r.opts.length===3?"c3":""}">${r.opts.map((w,k)=>`<button class="opt" data-k="${k}">${picHTML(w)}</button>`).join("")}</div>
    <div class="reveal" id="reveal"></div></div>`;
  const hear=()=>play([sayWord(r.target,r.lang)]);
  $("#hear").onclick=hear;$("#pal").onclick=hear;
  let misses=0,finished=false;
  $$(".opt").forEach(b=>b.onclick=async()=>{
    if(finished||b.classList.contains("wrong"))return;
    const w=r.opts[+b.dataset.k];
    if(w===r.target){
      finished=true;b.classList.add("right");chime();gotWord();mark(r.lang,w.id,misses===0);
      let sticker=null;if(misses===0){g.stars++;sticker=addStar()}
      if(sticker)g.newSticker=sticker;
      const pr=praise(r.lang);
      $("#reveal").innerHTML=[r.lang,...settings.order.filter(l=>l!==r.lang)].map(l=>wordRow(w,l)).join("")+
        `<button class="bigbtn go" id="nextR">Next ▶</button>`;
      $$("#reveal .wrow").forEach(x=>x.onclick=()=>play([sayWord(w,x.dataset.l)]));
      $("#nextR").onclick=()=>{g.r++;go("find",view)};
      play([sayWord(w,r.lang),pr]);
    }else{
      misses++;b.classList.add("wrong");boop();
      if(misses===1){hop(r.lang==="zh"?"再听一次！Listen again!":"Try again!");setTimeout(hear,500)}
      else{
        /* Bridge hint: say it in a language she knows better, then the target again. */
        const bridge=r.lang==="sv"?"en":"sv";
        const ix=r.opts.indexOf(r.target);$$(".opt")[ix].classList.add("hint");
        hop(`${chip(bridge)} ${esc(r.target[bridge])}`);
        play([sayWord(r.target,bridge),{pause:300},sayWord(r.target,r.lang)]);
      }
    }});
  setTimeout(hear,350);
};
function startFind(deckId,count=ROUNDS,isDaily=false){
  const pool=poolFor(deckId);const n=Math.min(settings.choices,pool.length);
  const langs=Array.from({length:count},pickLang);
  const rounds=[];const used=new Set();
  langs.forEach(l=>{let t=pickTargets(pool.filter(w=>!used.has(w.id)),l,1)[0]||rnd(pool);used.add(t.id);rounds.push({lang:l,target:t,opts:makeOptions(t,pool,l,n)})});
  go("find",{deck:deckId,game:{r:0,stars:0,rounds,max:count,daily:isDaily},back:isDaily?null:()=>go("find")})}

    else{misses++;b.classList.add("wrong");boop();if(misses>=1){const ix=it.opts.findIndex(x=>x.word===it.word);$$("#opts .opt")[ix].classList.add("hint")}}})};
function startPh(kind,level){
  const all=phWords(level);const items=shuffle(all).slice(0,Math.min(8,all.length)).map(it=>({...it,opts:shuffle([it,...shuffle(all.filter(x=>x.word!==it.word&&x.pic!==it.pic)).slice(0,2)])}));
  go(kind,{level,game:{r:0,stars:0,max:items.length,items},back:()=>go(kind,{back:()=>go("phonics")})})}

VIEWS.read=app=>{
  if(view.level==null){
    app.innerHTML=`<div class="wrap">${buddy("Look at the picture. Read the words. Tap the right one!")}
      <div class="tiles">${BLEND_LEVELS.map((L,k)=>`<button class="tile sm" data-lv="${k}"><span class="ic">${L.icon}</span><b>${L.name}</b><small>${phon["read"+k]?"⭐ ".repeat(Math.min(3,phon["read"+k])):"&nbsp;"}</small></button>`).join("")}</div></div>`;
    return $$("[data-lv]").forEach(b=>b.onclick=()=>startPh("read",+b.dataset.lv))}
  const g=view.game;if(g.r>=g.max){phon["read"+view.level]=(phon["read"+view.level]||0)+1;saveAll();return endScreen(app,g,()=>startPh("read",view.level))}
  const it=g.items[g.r];
  app.innerHTML=`<div class="stage">
    <div class="progressbar"><span style="width:${g.r/g.max*100}%"></span></div>
    <div class="card" style="width:100%;max-width:560px"><div class="pic bigpic">${picHTML(it.pic,"7rem")}</div></div>
    <div class="opts c3">${it.opts.map((o,k)=>`<button class="opt word" data-k="${k}">${o.word}</button>`).join("")}</div></div>`;
  let misses=0,fin=false;
  $$(".opt").forEach(b=>b.onclick=()=>{
    if(fin||b.classList.contains("wrong"))return;const o=it.opts[+b.dataset.k];
    if(o.word===it.word){fin=true;b.classList.add("right");chime();gotWord();if(!misses){g.stars++;const s=addStar();if(s)g.newSticker=s}
      play([{lang:"en",text:it.word,key:"pw:"+it.word},praise("en")]);setTimeout(()=>{g.r++;go("read",view)},1800)}
    else{misses++;b.classList.add("wrong");boop();if(misses>=2){const ix=it.opts.findIndex(x=>x.word===it.word);$$(".opt")[ix].classList.add("hint");
      play(it.tiles.map(t=>saySound(t)).concat([{lang:"en",text:it.word,key:"pw:"+it.word}]))}}})};

VIEWS.sight=app=>{
  if(view.level==null){
    app.innerHTML=`<div class="wrap">${buddy("Tricky words! You can't sound these out, you just know them.")}
      <div class="tiles">${SIGHT.map((L,k)=>`<button class="tile sm" data-lv="${k}"><span class="ic">${["🐣","🐥","🐔","🦅"][k]}</span><b>${L.slice(0,4).join(" ")}</b><small>${phon["sight"+k]?"⭐ ".repeat(Math.min(3,phon["sight"+k])):"Level "+(k+1)}</small></button>`).join("")}</div></div>`;
    return $$("[data-lv]").forEach(b=>b.onclick=()=>{const lv=+b.dataset.lv;const L=SIGHT[lv];const items=shuffle(L).map(wd=>({word:wd,opts:shuffle([wd,...shuffle(L.filter(x=>x!==wd)).slice(0,3)])}));
      go("sight",{level:lv,game:{r:0,stars:0,max:items.length,items},back:()=>go("sight",{back:()=>go("phonics")})})})}
  const g=view.game;if(g.r>=g.max){phon["sight"+view.level]=(phon["sight"+view.level]||0)+1;saveAll();return endScreen(app,g,()=>{const L=SIGHT[view.level];const items=shuffle(L).map(wd=>({word:wd,opts:shuffle([wd,...shuffle(L.filter(x=>x!==wd)).slice(0,3)])}));go("sight",{level:view.level,game:{r:0,stars:0,max:items.length,items},back:view.back})})}
  const it=g.items[g.r];const hear=()=>play([{lang:"en",text:it.word,key:"pw:"+it.word}]);
  app.innerHTML=`<div class="stage">
    <div class="progressbar"><span style="width:${g.r/g.max*100}%"></span></div>
    ${buddy("Find the word!")}
    <button class="hear en" id="hear">🔊</button>
    <div class="opts">${it.opts.map((o,k)=>`<button class="opt word" data-k="${k}">${o}</button>`).join("")}</div></div>`;
  $("#hear").onclick=hear;let misses=0,fin=false;
  $$(".opt").forEach(b=>b.onclick=()=>{
    if(fin||b.classList.contains("wrong"))return;
    if(it.opts[+b.dataset.k]===it.word){fin=true;b.classList.add("right");chime();gotWord();if(!misses){g.stars++;const s=addStar();if(s)g.newSticker=s}
      play([praise("en")]);setTimeout(()=>{g.r++;go("sight",view)},1500)}
    else{misses++;b.classList.add("wrong");boop();setTimeout(hear,400)}});
  setTimeout(hear,300)};

/* ---------- Stickers ---------- */
VIEWS.stickers=app=>{
  const have=Math.min(STICKERS.length,Math.floor(stars/STARS_PER_STICKER));const left=STARS_PER_STICKER-stars%STARS_PER_STICKER;
  app.innerHTML=`<div class="wrap">${buddy(have<STICKERS.length?`${left} more ⭐ for a new sticker!`:"You have every sticker! 🎉")}
    <div class="stickers">${STICKERS.map((s,k)=>k<have?`<div class="stk">${s}</div>`:`<div class="stk locked">${k===have?"⭐".repeat(STARS_PER_STICKER-left)||"?":"?"}</div>`).join("")}</div></div>`};

/* ---------- Grown-ups ---------- */
VIEWS.parents=app=>{
  const decks=DECKS;const rd=view.recDeck||"fruit";
  const stat=l=>{const n=WORDS.filter(w=>known(l,w.id)).length;return `<div class="stat">${chip(l)}<div class="bar"><span style="width:${n/WORDS.length*100}%;background:var(--${l})"></span></div><span>${n} / ${WORDS.length}</span></div>`};
  const zhSeen=WORDS.filter(w=>progress.zh[w.id]);
  const order=[["sv","en","zh"],["zh","sv","en"],["en","sv","zh"],["zh","en","sv"]];
  const last7=[6,5,4,3,2,1,0].map(i=>{const d=dayAgo(i),x=daily[dayKey(d)]||{words:0,hearts:0};return `<div class="${i===0?"today":""}"><i>${x.hearts?"💖".repeat(Math.min(x.hearts,3)):""}</i>${x.words}w</div>`}).join("");
  app.innerHTML=`<div class="wrap" style="gap:14px">
  <div class="panel"><h2>💖 Reward Jar hearts</h2>
    <p>Ella earns a heart for every ${settings.perHeart} words she gets right, up to ${settings.heartCap} a day. Add them to her Reward Jar in the Savings Tracker, then tap the button below.</p>
    <div class="streak" style="box-shadow:none;border-color:var(--line)"><div class="nums">
      <div class="sb b"><b>💖 ${hearts.pending}</b><small>to add to the Reward Jar</small></div>
      <div class="sb a"><b>🌈 ${streakDays()}</b><small>day streak</small></div></div>
      <div class="week">${last7}</div></div>
    <p>Earned in total: ${hearts.total} 💖</p>
    ${hearts.pending?`<button class="bigbtn go" id="handed">✅ I added ${hearts.pending} ${hearts.pending===1?"heart":"hearts"} to the jar</button>`:""}</div>

  <div class="panel"><h2>Progress</h2><p>A word counts as known after she gets it right twice.</p>
    ${["zh","sv","en"].map(stat).join("")}
    <div class="label" style="margin:6px 0 0">Chinese words practised (green = known)</div>
    <div class="wordlist">${zhSeen.length?zhSeen.map(w=>`<span class="${known("zh",w.id)?"k":""}">${w.pic[0]==="#"||w.pic.startsWith("n:")?"":w.pic} ${esc(w.zh)}</span>`).join(""):"<p>None yet. Try Listen &amp; find.</p>"}</div>
    <p>Total stars: ⭐ ${stars}</p></div>

  <div class="panel"><h2>Settings</h2>
    <div><div class="label">Language in games</div><div class="pills">${[["mix","Mix (half Chinese)"],["zh","中文"],["sv","Svenska"],["en","English"]].map(([k,t])=>`<button class="pill ${k}" data-set="gameLang" data-v="${k}" aria-pressed="${settings.gameLang===k}">${t}</button>`).join("")}</div></div>
    <div><div class="label">Words for one heart</div><div class="pills">${[5,10,15,20].map(n=>`<button class="pill" data-set="perHeart" data-v="${n}" aria-pressed="${settings.perHeart===n}">${n}</button>`).join("")}</div></div>
    <div><div class="label">Most hearts per day</div><div class="pills">${[1,2,3].map(n=>`<button class="pill" data-set="heartCap" data-v="${n}" aria-pressed="${settings.heartCap===n}">${n}</button>`).join("")}</div></div>
    <div><div class="label">Pictures to choose from</div><div class="pills">${[3,4].map(n=>`<button class="pill" data-set="choices" data-v="${n}" aria-pressed="${settings.choices===n}">${n}</button>`).join("")}</div></div>
    <div><div class="label">Word order on cards</div><div class="pills">${order.map(o=>`<button class="pill" data-set="order" data-v="${o.join(",")}" aria-pressed="${settings.order.join(",")===o.join(",")}">${o.map(l=>LANG[l].chip).join(" ")}</button>`).join("")}</div></div>
    <div><div class="label">Pinyin under Chinese words</div><div class="pills">${[[true,"Show"],[false,"Hide"]].map(([v,t])=>`<button class="pill" data-set="pinyin" data-v="${v}" aria-pressed="${settings.pinyin===v}">${t}</button>`).join("")}</div></div>
  </div>

  <div class="panel"><h2>Record your voice</h2>
    <p>Your voice is better than the device voice, especially for Swedish and Chinese. Tap 🎙 to start, tap again to stop. Recordings stay on this device.</p>
    ${canRecord?"":"<p><b>This browser can't record sound.</b></p>"}
    <select id="recDeck">${GROUPS.map(g=>`<optgroup label="${esc(g.name.en)}">${g.decks.map(id=>decks.find(d=>d.id===id)).map(d=>`<option value="${d.id}" ${d.id===rd?"selected":""}>${esc(d.name.en)}</option>`).join("")}</optgroup>`).join("")}<option value="_sounds" ${rd==="_sounds"?"selected":""}>Phonics: letter sounds</option><option value="_pw" ${rd==="_pw"?"selected":""}>Phonics: words</option></select>
    <div id="recList">${recRows(rd)}</div></div>

  <div class="panel"><h2>Start over</h2><p>Clears stars, stickers and word progress on this device. Hearts, the streak and recordings are kept.</p>
    <button class="bigbtn ghost hold" id="reset"><span class="fill"></span>Press and hold to reset</button></div>
  </div>`;
  $$("[data-set]").forEach(b=>b.onclick=()=>{const k=b.dataset.set,v=b.dataset.v;
    settings[k]=["choices","perHeart","heartCap"].includes(k)?+v:k==="pinyin"?v==="true":k==="order"?v.split(","):v;saveAll();go("parents",{recDeck:rd})});
  if($("#handed"))$("#handed").onclick=()=>{if(confirm(`Mark ${hearts.pending} heart(s) as added to the Reward Jar?`)){hearts.pending=0;saveAll();go("parents",{recDeck:rd})}};
  $("#recDeck").onchange=e=>go("parents",{recDeck:e.target.value});
  bindRec();
  holdToOpen($("#reset"),()=>{progress={sv:{},en:{},zh:{}};stars=0;phon={};saveAll();go("parents",{recDeck:rd})});
};
function recItems(rd){
  if(rd==="_sounds")return Object.keys(SOUNDS).map(s=>({pic:SOUNDS[s][2],name:`${s}  (as in ${SOUNDS[s][1]})`,keys:[["en","p:"+s,SOUNDS[s][0]]]}));
  if(rd==="_pw"){const ws=new Set();BLEND_LEVELS.forEach(L=>L.words.forEach(([t])=>ws.add(t.replace(/-/g,""))));SIGHT.flat().forEach(w=>ws.add(w));Object.values(SOUNDS).forEach(s=>ws.add(s[1]));
    return [...ws].map(w=>({pic:"🔤",name:w,keys:[["en","pw:"+w,w]]}))}
  return DECKS.find(d=>d.id===rd).list.map(w=>({w,pic:w.pic,name:`${w.sv} · ${w.en} · ${w.zh}`,keys:["sv","en","zh"].map(l=>[l,wkey(w,l),w[l]])}))}
function recRows(rd){return recItems(rd).map((it,i)=>`<div class="recrow"><div class="p">${it.w?picHTML(it.w):`<div class="pic"><span class="emo">${it.pic}</span></div>`}</div><div class="nm">${esc(it.name)}</div>
  ${it.keys.map(([l,k,t])=>`<span style="display:inline-flex;gap:4px">${chip(l)}<button class="recbtn ${recs.has(k)?"has":""}" data-rk="${esc(k)}" data-l="${l}" data-t="${esc(t)}">🎙</button>${recs.has(k)?`<button class="recbtn" data-del="${esc(k)}" aria-label="Delete">✖</button>`:""}</span>`).join("")}</div>`).join("")}
let live=null;
function bindRec(){
  $$("[data-rk]").forEach(b=>b.onclick=async()=>{
    const k=b.dataset.rk;
    if(live&&live.key===k){b.disabled=true;const blob=await live.rec.stop();live=null;if(blob.size>0)saveRec(k,blob);refreshRec();play([{lang:b.dataset.l,text:b.dataset.t,key:k}]);return}
    if(live)return;
    if(!canRecord){alert("Recording isn't supported in this browser.");return}
    stopAll();try{live={key:k,rec:await startRec()};b.classList.add("live");b.textContent="⏹"}catch(e){live=null;alert("Couldn't use the microphone. Check the browser's microphone permission.")}});
  $$("[data-del]").forEach(b=>b.onclick=()=>{delRec(b.dataset.del);refreshRec()});}
function refreshRec(){const rd=$("#recDeck").value;$("#recList").innerHTML=recRows(rd);bindRec()}

/* ================= Start ================= */
loadRecs().then(()=>{});
render();
</script>
</body>
</html>
